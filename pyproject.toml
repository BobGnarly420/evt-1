[project]
name = "evt-1"
version = "0.1.0"
description = "EVT-1 minimal protocol server"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "EVT-1 Contributors"}]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.2",
  "pynacl>=1.5.0",
  "rapidfuzz>=3.9.7"
]

[project.optional-dependencies]
mcp = [
  "mcp>=2,<3",
  "httpx>=0.27.2"
]
dev = [
  "pytest>=8.3.3",
  "httpx>=0.27.2",
  "ruff>=0.6.9",
  "pre-commit>=3.8.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework's idiom.
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*", "agents*"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
